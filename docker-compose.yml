name: "task_mgmt"
services:
  app:
    build :
      context: .
      dockerfile: Dockerfile
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL : jdbc:mysql://db:3306/schemas
      SPRING_DATASOURCE_USERNAME : root
      SPRING_DATASOURCE_PASSWORD : root

  db:
    image : mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: schemas
    ports :
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

    # *** ADD THIS BLOCK: MySQL Health Check ***
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10
      start_period: 10s

volumes:
  mysql_data: